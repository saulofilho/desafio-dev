# API specifications settings
api:
  docs:
    auth:
      password: ''
      username: ''
    root: 'swagger'
    versions:
      - default_host: ''
        description: 'File Parser Docs'
        endpoint: 'v1/swagger.yaml'
        id: 'v1/swagger.yaml'
        openapi: '3.0.3'
        title: 'File Parser'
        version: 'v1'
  schemas:
    error_response:
      type: 'object'
      properties:
        error:
          $ref: '#/components/schemas/exception'
      required:
        - 'error'
    exception:
      type: 'object'
      properties:
        id:
          type: 'string'
        message:
          type: 'string'
    user:
      type: 'object'
      properties:
        user:
          type: 'object'
          properties:
            email:
              type: 'string'

# CORS settings
cors:
  allowed_origins: '*'

# Database connection url
database:
  name: <%= ENV.fetch('DB_NAME') { nil } %>
  user: <%= ENV.fetch('DB_USER') { 'postgres' } %>
  pass: <%= ENV.fetch('DB_PASS') { 'postgres' } %>
  host: <%= ENV.fetch('DB_HOST') { 'db' } %>

secret_key: <%= ENV.fetch('SECRET_KEY') { '' } %>

# I18n Settings
i18n:
  available_locales:
    - en
    - pt-BR
  default_locale: 'pt-BR'
