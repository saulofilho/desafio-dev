---
openapi: 3.0.3
info:
  title: File Parser
  version: v1
paths:
  "/v1/transactions":
    get:
      summary: Get a list of Transactions
      tags:
      - Transactions
      responses:
        '200':
          description: transactions fetched with success
  "/v1/transactions/upload":
    post:
      summary: Upload a File
      tags:
      - Transactions
      parameters: []
      responses:
        '201':
          description: stores and transactions are created with success
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
  "/v1/users":
    post:
      summary: create a user
      tags:
      - Users
      operationId: user_create
      parameters: []
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/user"
                required:
                - user
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/user"
servers:
- url: "{defaultHost}"
  variables:
    defaultHost:
      default: ''
components:
  schemas:
    error_response:
      type: object
      properties:
        error:
          "$ref": "#/components/schemas/exception"
      required:
      - error
    exception:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
    user:
      type: object
      properties:
        user:
          type: object
          properties:
            email:
              type: string
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
    basic_auth:
      type: http
      scheme: basic
